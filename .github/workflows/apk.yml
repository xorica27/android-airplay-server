name: Generate APK (local build, no signing secrets)

env:
  main_project_module: app

on:
  push:
    branches:
      - "build/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Use JDK
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "21"
          cache: "gradle"

      # assembleDebug is deliberate: it is signed with the standard debug key, so the build needs
      # no keystore secrets, and it builds every ABI including 32-bit armeabi-v7a for TVs that
      # cannot install arm64-only APKs.
      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ${{ env.main_project_module }}/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
